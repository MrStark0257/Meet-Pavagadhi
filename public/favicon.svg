<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Modern Electric Blue & Cyan Gradient -->
    <linearGradient id="mpBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark High-Tech Hexagonal Container -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="#030712" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Inner Cyan Accent Line -->
  <rect x="7" y="7" width="50" height="50" rx="10" fill="none" stroke="#00F0FF" stroke-width="0.75" stroke-opacity="0.3" />

  <!-- Bold Neon Blue "MP" Text -->
  <text 
    x="32" 
    y="35" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-weight="900" 
    font-size="28" 
    fill="url(#mpBlueGrad)" 
    text-anchor="middle" 
    dominant-baseline="central"
    letter-spacing="-1.5"
    filter="url(#neonGlow)"
  >
    MP
  </text>
</svg>