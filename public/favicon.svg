<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>

    <!-- Outer Cyan to Blue Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00A2FF"/>
      <stop offset="100%" stop-color="#2962FF"/>
    </linearGradient>

    <!-- Text Gradient (Cyan M -> Deep Blue P) -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#0091FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Dark Rounded Square Container -->
  <rect width="512" height="512" rx="136" fill="url(#bgGrad)"/>
  
  <!-- Outer Vibrant Cyan/Blue Border -->
  <rect width="492" height="492" x="10" y="10" rx="126" fill="none" stroke="url(#borderGrad)" stroke-width="16"/>

  <!-- Inner Subtle Dark Inset Border -->
  <rect width="458" height="458" x="27" y="27" rx="109" fill="none" stroke="#00D2FF" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Clean Bold MP Text without extra lights -->
  <text 
    x="256" 
    y="336" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" 
    font-size="250" 
    font-weight="900" 
    letter-spacing="-8"
    text-anchor="middle" 
    fill="url(#textGrad)"
  >MP</text>
</svg>